name: market_bot

# Lean 24/7 stack. UI on 3002 so ProtectYourDoc Uptime Kuma keeps 3001.
# Cap RAM so ProtectYourDoc is not squeezed. ~1.3 GiB reserved.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.25
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: market_bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d market_bot"]
      interval: 10s
      timeout: 5s
      retries: 12
    expose:
      - "5432"
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 48m
    cpus: 0.10
    command: redis-server --save "" --appendonly no --maxmemory 32mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    expose:
      - "6379"
    logging:
      options:
        max-size: "5m"
        max-file: "2"

  api:
    build: ./backend
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.50
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    working_dir: /app
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bot:bot@postgres:5432/market_bot
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build: ./backend
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.50
    command: python -m engine.worker
    working_dir: /app
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bot:bot@postgres:5432/market_bot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      api:
        condition: service_started
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ./frontend
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8002}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8002/ws}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
        NEXT_PUBLIC_DESK_TOKEN: ${DESK_TOKEN:-}
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.40
    env_file: .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8002}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8002/ws}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
      NEXT_PUBLIC_DESK_TOKEN: ${DESK_TOKEN:-}
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      - api
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
