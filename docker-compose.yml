name: market_bot

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: market_bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d market_bot"]
      interval: 5s
      timeout: 5s
      retries: 12
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    expose:
      - "6379"

  api:
    build: ./backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /app
    volumes:
      - ./backend:/app
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bot:bot@postgres:5432/market_bot
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./backend
    restart: unless-stopped
    command: python -m engine.worker
    working_dir: /app
    volumes:
      - ./backend:/app
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bot:bot@postgres:5432/market_bot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      api:
        condition: service_started

  web:
    build: ./frontend
    restart: unless-stopped
    command: npm run dev
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8002}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8002/ws}
      WATCHPACK_POLLING: "false"
      CHOKIDAR_USEPOLLING: "false"
      WATCHPACK_WATCHER_LIMIT: "20"
    ports:
      - "3001:3000"
    depends_on:
      - api

volumes:
  pgdata:
  web_node_modules:
  web_next:
